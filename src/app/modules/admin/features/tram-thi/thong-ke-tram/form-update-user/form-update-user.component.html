<ng-container [ngSwitch]="typeView">
  <ng-container *ngSwitchCase="0">
    <div class="form-ctn form-ctn--loading" role="status" aria-live="polite">
      <div class="form-loading">
        <p class="form-loading__text">Đang tải dữ liệu, vui lòng chờ</p>
        <mat-progress-bar class="form-loading__bar" mode="indeterminate"></mat-progress-bar>
      </div>
    </div>
  </ng-container>

  <ng-container *ngSwitchCase="-1">
    <div class="form-ctn form-ctn--error" role="alert" aria-live="assertive">
      <p class="form-error__text">Mất kết nối với máy chủ</p>
      <button pButton pRipple label="Tải lại" icon="pi pi-sync" class="p-button-warning" type="button" (click)="reLoad()"></button>
    </div>
  </ng-container>

  <ng-container *ngSwitchCase="1">
    <div class="form-ctn">
      <div class="form-head">
         <div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
        <form [formGroup]="fonm" autocomplete="off">
          <div class="row">
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Số CCCD <span class="ovic-mark">*</span></label>
                <input pRipple pInputText type="text" placeholder="Số CCCD..." formControlName="username"
                       autocomplete="off">
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Họ và tên <span class="ovic-mark">*</span></label>
                <input pRipple pInputText type="text" placeholder="Họ và tên..." formControlName="display_name"
                       autocomplete="off">
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Email <span class="ovic-mark">*</span></label>
                <input pRipple pInputText type="text" placeholder="Vd: tn200@example.com" formControlName="email"
                       autocomplete="off">
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Số điện thoại<span class="ovic-mark">*</span></label>
                <input pRipple pInputText type="text" placeholder="Vd: 0901234567" formControlName="phone"
                       autocomplete="off">
              </div>
            </div>
            <div class="col-12">
              <div class="form-row">
                <label>Mật khẩu<span class="ovic-mark">*</span></label>
                <input pRipple pInputText type="text" placeholder="Nhập mật khẩu" formControlName="password"
                       autocomplete="off">

                <div style="position: absolute;right: 12px;top: 0;height: 100%;text-align: center;display: flex;align-items: center;">
                <i [pTooltip]="'Hiển thị mật khẩu'" [tooltipPosition]="'left'" class="mr-2 btn-check"  [ngClass]="[type_password==='password' ? 'pi pi-eye': 'pi pi-eye-slash']" (click)="btnShowPassWord()"></i>
                </div>
              </div>
            </div>
            
          </div>

          <div class="row">
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Trạng thái <span class="ovic-mark">*</span></label>
                <div class="form-row__switch-buttons">
                  <button class="btn form-row__btn-switch" [class.--btn-switch-active]="f['status'].value === 1"
                          (click)="changeStatus(1)">Kích hoạt</button>
                  <button class="btn form-row__btn-switch" [class.--btn-switch-active]="f['status'].value !== 1"
                          (click)="changeStatus(0)">Không kích hoạt</button>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-row">
                <label>Xác nhận Tài khoản <span class="ovic-mark">*</span></label>
                <span class="form-row__switch-buttons">
                  <button class="btn form-row__btn-switch" [class.--btn-switch-active]="f['verified'].value === 1"
                          (click)="changeVerified(1)">Xác nhận</button>
                  <button class="btn form-row__btn-switch" [class.--btn-switch-active]="f['verified'].value !== 1"
                          (click)="changeVerified(0)">Chưa xác nhận</button>
                </span>
              </div>
            </div>
          </div>
        

        </form>
      </div>
      </div>
      <div class="form-bottom">
        <span class="ovic-side-navigation-content__foot__notice mr-auto"><mark>(*)</mark> bắt buộc phải nhập</span>

        <button pButton pRipple type="button" label="Đóng" class="p-button-secondary" label="Cập nhật" (click)="btnUpdate()"></button>
      </div>
